<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2a4a"/>
      <stop offset="0.55" stop-color="#27406f"/>
      <stop offset="1" stop-color="#3a2f6b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb86b"/>
      <stop offset="1" stop-color="#ff7aa8"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="24" fill="url(#grid)"/>

  <!-- decorative agent nodes -->
  <g opacity="0.9">
    <line x1="930" y1="95" x2="850" y2="200" stroke="#9fb4e8" stroke-opacity="0.45" stroke-width="2"/>
    <line x1="930" y1="95" x2="960" y2="215" stroke="#9fb4e8" stroke-opacity="0.45" stroke-width="2"/>
    <line x1="930" y1="95" x2="1070" y2="195" stroke="#9fb4e8" stroke-opacity="0.45" stroke-width="2"/>
    <line x1="850" y1="200" x2="960" y2="215" stroke="#9fb4e8" stroke-opacity="0.25" stroke-width="2"/>
    <line x1="960" y1="215" x2="1070" y2="195" stroke="#9fb4e8" stroke-opacity="0.25" stroke-width="2"/>
    <circle cx="930" cy="95" r="34" fill="url(#accent)"/>
    <text x="930" y="103" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1b2a4a">AI</text>
    <circle cx="850" cy="200" r="22" fill="#6c8ee0"/>
    <circle cx="960" cy="215" r="22" fill="#6c8ee0"/>
    <circle cx="1070" cy="195" r="22" fill="#6c8ee0"/>
    <text x="850" y="207" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" fill="#fff">译</text>
    <text x="960" y="222" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" fill="#fff">校</text>
    <text x="1070" y="202" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" fill="#fff">包</text>
  </g>

  <text x="72" y="120" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="600" fill="#9fb4e8" letter-spacing="2">MULTI AGENT</text>
  <text x="70" y="188" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="64" font-weight="700" fill="#ffffff">游戏汉化器</text>
  <rect x="72" y="208" width="120" height="6" rx="3" fill="url(#accent)"/>
  <text x="72" y="255" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="24" fill="#d7e0f5">Claude 主控调度 · 本地小模型并行翻译 · 本机生成补丁</text>
</svg>
